name: CI

# Lint + production build on every push/PR to main. The build runs the
# prebuild hooks (render-theorems, generate-health) and uses the public-safe
# placeholder assets — no secrets or private-asset injection required, so this
# runs cleanly on a fork or a fresh clone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
