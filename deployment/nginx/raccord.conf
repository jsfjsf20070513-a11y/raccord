# Raccord — raccord.rucmathclass.com(Cloudflare 代理源站,HTTPS 在边缘终止)。
# 与 mathclasswebsite.conf 同结构;root 指向独立目录 /var/www/raccord/dist,
# 与旧站 /var/www/MathClassWebsite/dist 互不覆盖。/api/chat、/api/speak* 由
# Cloudflare Worker 路由在边缘接管,不会到达本源站。
# 安装:放 /etc/nginx/sites-available/ 并软链到 sites-enabled/;
# snippet 放 /etc/nginx/snippets/raccord-security-headers.conf。

server {
    listen 80;
    server_name raccord.rucmathclass.com;

    root /var/www/raccord/dist;
    index index.html;

    # nginx add_header 不向声明了自己 add_header 的 location 继承,
    # 所以每个这样的 location 都要显式 include。
    include snippets/raccord-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        include snippets/raccord-security-headers.conf;
        try_files /health.json =404;
    }

    location = /health.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        include snippets/raccord-security-headers.conf;
        try_files /health.json =404;
    }

    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/raccord-security-headers.conf;
        try_files $uri =404;
    }

    location /fonts/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/raccord-security-headers.conf;
        try_files $uri =404;
    }

    location /uploads/ {
        expires off;
        add_header Cache-Control "public, max-age=604800";
        include snippets/raccord-security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
        include snippets/raccord-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
