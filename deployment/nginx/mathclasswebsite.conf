# Block 1: Cloudflare origin — serves rucmathclass.com (proxied, HTTPS at edge)
server {
    listen 80;
    server_name rucmathclass.com www.rucmathclass.com;

    root /var/www/MathClassWebsite/dist;
    index index.html;

    # Security headers. nginx add_header does NOT inherit into any location
    # that declares its own add_header, so every such location re-includes
    # the snippet explicitly.
    include snippets/mathclass-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        include snippets/mathclass-security-headers.conf;
        try_files /health.json =404;
    }

    location = /health.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        include snippets/mathclass-security-headers.conf;
        try_files /health.json =404;
    }

    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/mathclass-security-headers.conf;
        try_files $uri =404;
    }

    location /fonts/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/mathclass-security-headers.conf;
        try_files $uri =404;
    }

    location /uploads/ {
        expires off;
        add_header Cache-Control "public, max-age=604800";
        include snippets/mathclass-security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
        include snippets/mathclass-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Block 2: direct-IP / unknown-Host traffic — redirect to the HTTPS domain.
# Serving the login-capable SPA over plain HTTP at the bare IP exposed
# Supabase credentials to on-path attackers; everything now goes through
# the Cloudflare-terminated HTTPS domain. /health(.json) stays reachable
# for uptime monitors.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/MathClassWebsite/dist;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        include snippets/mathclass-security-headers.conf;
        try_files /health.json =404;
    }

    location = /health.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        include snippets/mathclass-security-headers.conf;
        try_files /health.json =404;
    }

    location / {
        return 301 https://rucmathclass.com$request_uri;
    }
}
