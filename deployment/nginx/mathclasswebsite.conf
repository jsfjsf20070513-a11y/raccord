server {
    listen 80;
    server_name <SERVER_NAME>;

    root /var/www/<PROJECT_NAME>/dist;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Basic security headers (kept conservative; tighten CSP later if needed)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","app":"MathClassWebsite","version":"1.0.0","mode":"nginx-static"}';
    }

    location = /health.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /health.json =404;
    }

    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        expires off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Optional future backend. Keep this disabled until a local API service exists.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
