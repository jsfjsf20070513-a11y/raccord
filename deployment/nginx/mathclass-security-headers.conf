add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: script-src is strict ('self' + sha256 of the two developer-authored
# inline scripts in index.html — stable across builds). connect-src allows
# Supabase (REST + realtime wss) and Solana devnet RPC. style-src needs
# 'unsafe-inline' for the inline <style> block + pre-rendered KaTeX inline
# style attributes. No wasm/eval in the bundle, so no 'unsafe-eval'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-cxmT4JP+ZwV3ykm8YJdOaAiqgZEx0mqh4lMPRWb5jS4=' 'sha256-cuCNONxwUu5LAzZDopxj0ra/nHL/JdmQGRIhKn2vzbA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.devnet.solana.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
