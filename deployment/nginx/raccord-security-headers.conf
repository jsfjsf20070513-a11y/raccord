# Raccord (raccord.rucmathclass.com) security headers.
# 与 mathclass-security-headers.conf 同构,仅一处差异:CSP connect-src 去掉了
# Solana devnet——Raccord 已退役 Web3 前端,新站不需要该出口。
# (主站 snippet 不能改:线上 rucmathclass.com 仍是 Web3 时代旧构建,还要用它。)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
