  <head>

    <title>Raccord</title>
    <link rel="stylesheet" href="/src/vendor.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='40' fill='%23ffffff' font-family='serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E"
    />
    <script src="/boot-start.js"></script>
    <style>
      :root {
        --boot-paper: #fdfcf8;
        --boot-ink: #1a1a1a;
        --boot-muted: #6b6b6b;
        --boot-accent: #8b0000;
        --boot-rule: rgba(26, 26, 26, 0.14);
        --boot-page-width: 680px;
        --loading-accent: #8b0000;
        --loading-muted: #6f5a56;
        --loading-ink: #241816;
        --loading-overlay-start: rgba(139, 0, 0, 0.16);
        --loading-overlay-end: rgba(92, 58, 42, 0.1);
        --loading-background-top: #fdfaf4;
        --loading-background-bottom: #f6efe6;
        --loading-glow-primary: rgba(139, 0, 0, 0.22);
        --loading-glow-secondary: rgba(92, 58, 42, 0.16);
        --loading-border: rgba(66, 38, 28, 0.09);
        --loading-rule: rgba(66, 38, 28, 0.18);
      }

      html,
      body {
        min-height: 100%;
        background: var(--boot-paper);
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--boot-ink);
      }

      #root {
        min-height: 100vh;
      }

      .page-column {
        max-width: var(--boot-page-width);
        margin: 0 auto;
        padding: 72px 24px 0;
      }

      .page-loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 22%, var(--loading-overlay-start), transparent 30%),
          radial-gradient(circle at 82% 70%, var(--loading-overlay-end), transparent 36%),
          linear-gradient(180deg, var(--loading-background-top), var(--loading-background-bottom));
        overflow: hidden;
      }

      .page-loading-overlay::before {
        content: "";
        position: absolute;
        inset: 26px;
        border: 1px solid var(--loading-border);
        pointer-events: none;
      }

      .page-loading-shell {
        width: 100%;
        min-height: auto;
        display: flex;
        align-items: center;
        font-family: "EB Garamond", "Noto Serif SC", "Source Han Serif SC", serif;
      }

      .page-loading-card {
        position: relative;
        width: min(100%, 42rem);
        padding-top: 24px;
        border-top: 1px solid var(--loading-rule);
      }

      .page-loading-card::before,
      .page-loading-card::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .page-loading-atmosphere {
        position: absolute;
        inset: -56px -32px auto auto;
        pointer-events: none;
      }

      .page-loading-orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(10px);
        animation: boot-loading-float 8s ease-in-out infinite;
      }

      .page-loading-orb.is-primary {
        top: -12px;
        right: 14px;
        width: 180px;
        height: 180px;
        background: radial-gradient(circle, var(--loading-glow-primary), transparent);
      }

      .page-loading-orb.is-secondary {
        top: 82px;
        right: 132px;
        width: 112px;
        height: 112px;
        background: radial-gradient(circle, var(--loading-glow-secondary), transparent);
        animation-delay: -3s;
      }

      .page-loading-eyebrow {
        margin: 0 0 8px;
        color: var(--loading-muted);
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .page-loading-theme-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 14px;
      }

      .page-loading-badge {
        width: 42px;
        height: 42px;
        border: 1px solid var(--loading-rule);
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--loading-accent);
        background: rgba(255, 255, 255, 0.28);
        font-family: "Noto Serif SC", "Source Han Serif SC", serif;
        font-size: 20px;
      }

      .page-loading-motto {
        margin: 0;
        color: var(--loading-muted);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .page-loading-kicker {
        margin: 0 0 12px;
        color: var(--loading-accent);
        font-size: 14px;
        font-style: italic;
        letter-spacing: 0.08em;
      }

      .page-loading-title {
        margin: 0;
        color: var(--loading-muted);
        font-size: 18px;
        font-family: "Noto Serif SC", "Source Han Serif SC", serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .page-loading-quote-frame {
        min-height: 7.8rem;
        margin-top: 22px;
        display: flex;
        align-items: flex-end;
      }

      .page-loading-quote {
        margin: 0;
        font-size: 36px;
        line-height: 1.42;
        letter-spacing: 0.02em;
        color: var(--loading-ink);
      }

      .page-loading-note {
        margin: 16px 0 0;
        color: var(--loading-muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .page-loading-footer {
        margin-top: 26px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .page-loading-meter {
        flex: 1 1 auto;
        height: 1px;
        background: var(--loading-border);
        overflow: hidden;
      }

      .page-loading-meter span {
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--loading-accent), transparent);
        transform: translateX(-140%);
        animation: boot-loading-sweep 1.5s ease-in-out infinite;
      }

      .page-loading-index {
        margin: 0;
        color: var(--loading-muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.2em;
        white-space: nowrap;
      }

      .page-loading-ledger {
        margin: 14px 0 0;
        color: var(--loading-muted);
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .page-loading-card.theme-home::after {
        content: "§";
        top: 16px;
        right: 2px;
        color: var(--loading-border);
        font-family: "EB Garamond", serif;
        font-size: 106px;
        line-height: 1;
      }

      .page-loading-card.theme-home .page-loading-badge {
        border-radius: 14px;
      }

      .page-loading-card.theme-gallery::before {
        top: 32px;
        right: 8px;
        width: 124px;
        height: 162px;
        border: 1px solid var(--loading-border);
        transform: rotate(-4deg);
        opacity: 0.32;
      }

      .page-loading-card.theme-gallery::after {
        top: 42px;
        right: 24px;
        width: 124px;
        height: 162px;
        border: 1px solid var(--loading-rule);
        box-shadow: inset 0 0 0 8px rgba(255, 255, 255, 0.3);
        transform: rotate(4deg);
        opacity: 0.48;
      }

      .page-loading-card.theme-gallery .page-loading-badge {
        border-radius: 10px;
      }

      .page-loading-card.theme-resources::before {
        top: 34px;
        right: 18px;
        width: 118px;
        height: 156px;
        background:
          linear-gradient(90deg, transparent 0 14px, var(--loading-border) 14px 17px, transparent 17px 37px, var(--loading-border) 37px 39px, transparent 39px 62px, var(--loading-border) 62px 66px, transparent 66px 100%);
        opacity: 0.5;
      }

      .page-loading-card.theme-resources::after {
        top: 26px;
        right: 0;
        width: 156px;
        height: 170px;
        background:
          linear-gradient(var(--loading-rule), var(--loading-rule)) 0 0 / 100% 1px no-repeat,
          linear-gradient(var(--loading-rule), var(--loading-rule)) 0 100% / 100% 1px no-repeat,
          repeating-linear-gradient(180deg, transparent 0 27px, var(--loading-border) 27px 28px);
        opacity: 0.42;
      }

      .page-loading-card.theme-resources .page-loading-badge {
        border-radius: 8px;
      }

      .page-loading-card.theme-manage::before {
        top: 26px;
        right: 4px;
        width: 160px;
        height: 160px;
        border: 1px solid var(--loading-rule);
        transform: rotate(-2deg);
        opacity: 0.34;
      }

      .page-loading-card.theme-manage::after {
        top: 34px;
        right: 16px;
        width: 160px;
        height: 160px;
        background:
          linear-gradient(var(--loading-border) 1px, transparent 1px) 0 0 / 100% 26px,
          linear-gradient(90deg, var(--loading-border) 1px, transparent 1px) 0 0 / 26px 100%;
        opacity: 0.36;
      }

      .page-loading-card.theme-manage .page-loading-badge {
        border-radius: 12px;
      }

      @keyframes boot-loading-sweep {
        from {
          transform: translateX(-140%);
        }

        to {
          transform: translateX(240%);
        }
      }

      @keyframes boot-loading-float {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }

        50% {
          transform: translate3d(0, 14px, 0) scale(1.06);
        }
      }

      @media (max-width: 720px) {
        .page-loading-overlay {
          padding: 18px;
        }

        .page-loading-overlay::before {
          inset: 18px;
        }

        .page-column {
          padding-top: 44px;
        }

        .page-loading-card {
          width: 100%;
        }

        .page-loading-card::before,
        .page-loading-card::after {
          opacity: 0.26;
        }

        .page-loading-theme-meta {
          margin-bottom: 12px;
        }

        .page-loading-badge {
          width: 38px;
          height: 38px;
          font-size: 18px;
        }

        .page-loading-motto {
          font-size: 11px;
        }

        .page-loading-card.theme-gallery::before,
        .page-loading-card.theme-gallery::after {
          width: 92px;
          height: 122px;
        }

        .page-loading-card.theme-resources::before {
          width: 88px;
          height: 120px;
        }

        .page-loading-card.theme-resources::after,
        .page-loading-card.theme-manage::before,
        .page-loading-card.theme-manage::after {
          width: 112px;
          height: 118px;
        }

        .page-loading-quote-frame {
          min-height: 6.4rem;
          margin-top: 18px;
        }

        .page-loading-title {
          font-size: 16px;
        }

        .page-loading-quote {
          font-size: 28px;
        }

        .page-loading-note {
          font-size: 15px;
        }

        .page-loading-footer {
          gap: 12px;
        }
      }

      @media (max-width: 480px) {
        .page-loading-overlay {
          padding: 14px;
        }

        .page-loading-overlay::before {
          inset: 14px;
        }

        .page-loading-kicker {
          font-size: 13px;
        }

        .page-loading-theme-meta {
          gap: 10px;
          margin-bottom: 10px;
        }

        .page-loading-badge {
          width: 34px;
          height: 34px;
          font-size: 17px;
        }

        .page-loading-motto {
          font-size: 10px;
          letter-spacing: 0.14em;
        }

        .page-loading-title {
          font-size: 15px;
        }

        .page-loading-card::before,
        .page-loading-card::after {
          opacity: 0.18;
        }

        .page-loading-card.theme-home::after {
          font-size: 72px;
          top: 28px;
        }

        .page-loading-quote {
          font-size: 19px;
        }

        .page-loading-quote-frame {
          min-height: 5rem;
        }

        .page-loading-note {
          font-size: 14px;
        }

        .page-loading-ledger {
          font-size: 12px;
          letter-spacing: 0.14em;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="page-loading-overlay">
        <article class="page-column page-loading-shell" aria-live="polite" aria-busy="true">
          <section class="page-loading-card theme-home" role="status">
            <div class="page-loading-atmosphere" aria-hidden="true">
              <span class="page-loading-orb is-primary"></span>
              <span class="page-loading-orb is-secondary"></span>
            </div>
            <div class="page-loading-theme-meta">
              <span class="page-loading-badge" data-boot-badge aria-hidden="true">扉</span>
              <p class="page-loading-motto" data-boot-motto>序章展开 · Prologue</p>
            </div>
            <p class="page-loading-eyebrow" data-boot-eyebrow>扉页</p>
            <p class="page-loading-kicker" data-boot-kicker>Avant-propos</p>
            <p class="page-loading-title" data-boot-title>扉页正在徐徐展开</p>
            <div class="page-loading-quote-frame">
              <p class="page-loading-quote" data-boot-quote>每一次开始，都像在纸页上重新安放世界。</p>
            </div>
            <p class="page-loading-note" data-boot-note>扉页正在舒展开来，请稍候片刻。</p>
            <div class="page-loading-footer">
              <div class="page-loading-meter" aria-hidden="true">
                <span></span>
              </div>
              <p class="page-loading-index" data-boot-index>01 / 06</p>
            </div>
            <p class="page-loading-ledger" data-boot-ledger>Prelude · Memoire · Presence</p>
          </section>
        </article>
      </div>
    </div>
    <script src="/boot-loading.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
