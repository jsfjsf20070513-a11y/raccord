          phrases: [
            { text: '真正的协作，不是同时发声，而是让彼此的工作能够接续。', note: '案头正在整理，请稍候片刻。' },
            { text: '草稿的意义，不在于未完成，而在于它允许思想继续修订。', note: '这一页正在汇集协作内容。' },
            { text: '写作与编修都需要耐心，因为秩序总比灵感更晚抵达。', note: '协作页即将展开。' },
            { text: '被妥善记录的修改，才会成为后来人的道路与依据。', note: '请稍候，案头正在归整。' },
            { text: '工作台之所以重要，是因为它让零散努力终于彼此相遇。', note: '内容正在排列与装订。' },
            { text: '所有成品都曾是案头上一份尚未定稿的纸。', note: '页面正在显现协作流转。' },
          ],
        },
      }

      function resolveLoadingThemeKey(pathname) {
        if (pathname.startsWith('/gallery') || pathname.startsWith('/album/')) return 'gallery'
        if (pathname.startsWith('/timeline')) return 'gallery'
        if (pathname.startsWith('/announcements')) return 'gallery'
        if (pathname.startsWith('/resources')) return 'resources'
        if (pathname.startsWith('/manage') || pathname.startsWith('/login') || pathname.startsWith('/reset-password')) return 'manage'
        return 'home'
      }

      function getShanghaiDateKey() {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Shanghai',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        }).format(new Date())
      }

      function hashString(value) {
        return Array.from(value).reduce((sum, character) => sum + character.charCodeAt(0), 0)
      }

      const pathname = window.location.pathname || '/'
      const themeKey = resolveLoadingThemeKey(pathname)
      const theme = window.__MATH_CLASS_LOADING_THEMES__[themeKey] || window.__MATH_CLASS_LOADING_THEMES__.home
      const phrases = theme.phrases || []
      const bootIndex = phrases.length ? hashString(`${theme.id}:${getShanghaiDateKey()}`) % phrases.length : 0
      const entry = phrases[bootIndex] || phrases[0]
      const overlay = document.querySelector('.page-loading-overlay')
      const card = document.querySelector('.page-loading-card')
      const badge = document.querySelector('[data-boot-badge]')
      const motto = document.querySelector('[data-boot-motto]')
      const eyebrow = document.querySelector('[data-boot-eyebrow]')
      const kicker = document.querySelector('[data-boot-kicker]')
      const title = document.querySelector('[data-boot-title]')
      const quote = document.querySelector('[data-boot-quote]')
      const note = document.querySelector('[data-boot-note]')
      const ledger = document.querySelector('[data-boot-ledger]')
      const index = document.querySelector('[data-boot-index]')

      if (overlay && theme.palette) {
        overlay.classList.add(`theme-${theme.id}`)
        overlay.style.setProperty('--loading-accent', theme.palette.accent)
        overlay.style.setProperty('--loading-muted', theme.palette.muted)
        overlay.style.setProperty('--loading-ink', theme.palette.ink)
        overlay.style.setProperty('--loading-overlay-start', theme.palette.overlayStart)
        overlay.style.setProperty('--loading-overlay-end', theme.palette.overlayEnd)
        overlay.style.setProperty('--loading-background-top', theme.palette.backgroundTop)
        overlay.style.setProperty('--loading-background-bottom', theme.palette.backgroundBottom)
        overlay.style.setProperty('--loading-glow-primary', theme.palette.glowPrimary)
        overlay.style.setProperty('--loading-glow-secondary', theme.palette.glowSecondary)
        overlay.style.setProperty('--loading-border', theme.palette.border)
        overlay.style.setProperty('--loading-rule', theme.palette.rule)
      }

      if (card) {
        card.className = `page-loading-card theme-${theme.id}`
      }

      if (badge) badge.textContent = theme.badge
      if (motto) motto.textContent = theme.motto
      if (eyebrow) eyebrow.textContent = theme.eyebrow
      if (kicker) kicker.textContent = theme.kicker
      if (title) title.textContent = theme.title
      if (quote) quote.textContent = entry.text
      if (note) note.textContent = entry.note
      if (ledger) ledger.textContent = theme.ledger
      if (index) index.textContent = `${String(bootIndex + 1).padStart(2, '0')} / ${String(phrases.length).padStart(2, '0')}`
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
