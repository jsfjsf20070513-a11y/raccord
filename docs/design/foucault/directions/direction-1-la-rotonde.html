<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Direction 1 · La rotonde</title>
<style>
  html,body{margin:0;padding:0;width:1440px;height:1024px;overflow:hidden;background:#0d0b09;}
  .stage{position:relative;width:1440px;height:1024px;}
  svg{position:absolute;inset:0;}
</style>
</head>
<body>
<div class="stage">
<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pool" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#2a241d"/>
      <stop offset="34%" stop-color="#1c1712"/>
      <stop offset="70%" stop-color="#100d0a"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
    <radialGradient id="bob" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f2ead9"/>
      <stop offset="45%" stop-color="#cfc3ab"/>
      <stop offset="100%" stop-color="#6b6152"/>
    </radialGradient>
    <linearGradient id="swing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9e1cf" stop-opacity="0"/>
      <stop offset="18%" stop-color="#e9e1cf" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#f2ead9" stop-opacity=".95"/>
      <stop offset="82%" stop-color="#e9e1cf" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#e9e1cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.86  0 0 0 0 0.78  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="0.4"/></filter>
  </defs>

  <!-- stone floor -->
  <rect width="1440" height="1024" fill="url(#pool)"/>

  <!-- ENGRAVED FLOOR + PAGE FURNITURE : one rigid body, rotated -11° since release -->
  <g transform="rotate(-11 720 532)">
    <!-- meridian hairlines -->
    <g stroke="#c8bda6" stroke-opacity="0.13" stroke-width="1">
      <line x1="720" y1="92" x2="720" y2="972"/>
      <line x1="280" y1="532" x2="1160" y2="532"/>
      <line x1="409" y1="221" x2="1031" y2="843"/>
      <line x1="1031" y1="221" x2="409" y2="843"/>
      <line x1="547" y1="117" x2="893" y2="947"/>
      <line x1="893" y1="117" x2="547" y2="947"/>
      <line x1="305" y1="359" x2="1135" y2="705"/>
      <line x1="1135" y1="359" x2="305" y2="705"/>
    </g>
    <!-- rings -->
    <circle cx="720" cy="532" r="330" fill="none" stroke="#c8bda6" stroke-opacity="0.20" stroke-width="1"/>
    <circle cx="720" cy="532" r="331.6" fill="none" stroke="#0a0806" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="720" cy="532" r="440" fill="none" stroke="#c8bda6" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="720" cy="532" r="180" fill="none" stroke="#c8bda6" stroke-opacity="0.14" stroke-width="1"/>
    <!-- ring ticks every 5° -->
    <g stroke="#c8bda6" stroke-opacity="0.28" stroke-width="1">
      <g id="tk"><line x1="720" y1="196" x2="720" y2="208"/></g>
      <use href="#tk" transform="rotate(15 720 532)"/><use href="#tk" transform="rotate(30 720 532)"/>
      <use href="#tk" transform="rotate(45 720 532)"/><use href="#tk" transform="rotate(60 720 532)"/>
      <use href="#tk" transform="rotate(75 720 532)"/><use href="#tk" transform="rotate(90 720 532)"/>
      <use href="#tk" transform="rotate(105 720 532)"/><use href="#tk" transform="rotate(120 720 532)"/>
      <use href="#tk" transform="rotate(135 720 532)"/><use href="#tk" transform="rotate(150 720 532)"/>
      <use href="#tk" transform="rotate(165 720 532)"/><use href="#tk" transform="rotate(180 720 532)"/>
      <use href="#tk" transform="rotate(195 720 532)"/><use href="#tk" transform="rotate(210 720 532)"/>
      <use href="#tk" transform="rotate(225 720 532)"/><use href="#tk" transform="rotate(240 720 532)"/>
      <use href="#tk" transform="rotate(255 720 532)"/><use href="#tk" transform="rotate(270 720 532)"/>
      <use href="#tk" transform="rotate(285 720 532)"/><use href="#tk" transform="rotate(300 720 532)"/>
      <use href="#tk" transform="rotate(315 720 532)"/><use href="#tk" transform="rotate(330 720 532)"/>
      <use href="#tk" transform="rotate(345 720 532)"/>
    </g>
    <!-- release mark engraved in the floor at the initial azimuth (-14° at t0) -->
    <g transform="rotate(-14 720 532)" stroke="#c8bda6" stroke-opacity="0.32" stroke-width="1">
      <line x1="390" y1="532" x2="1050" y2="532" stroke-dasharray="1 7"/>
      <line x1="388" y1="524" x2="388" y2="540"/>
      <line x1="1052" y1="524" x2="1052" y2="540"/>
    </g>
    <!-- page furniture belongs to the floor : it tilts with the world -->
    <text x="720" y="150" text-anchor="middle" fill="#ded4bf" fill-opacity="0.85"
          font-family="Didot, 'Baskerville', serif" font-style="italic" font-size="34" letter-spacing="6">L&#8217;horizon immobile</text>
    <text x="720" y="180" text-anchor="middle" fill="#b0a690" fill-opacity="0.5"
          font-family="Menlo, monospace" font-size="11" letter-spacing="5">LA ROTONDE</text>
    <text x="180" y="952" fill="#b0a690" fill-opacity="0.45" font-family="Menlo, monospace" font-size="11" letter-spacing="3">02 / —</text>
    <text x="1260" y="952" text-anchor="end" fill="#b0a690" fill-opacity="0.45" font-family="Menlo, monospace" font-size="11" letter-spacing="3">T + 58 MIN</text>
  </g>

  <!-- THE SWING : pinned to the screen, it never turned -->
  <g transform="rotate(-14 720 532)">
    <rect x="400" y="530.5" width="640" height="3" fill="url(#swing)"/>
  </g>
  <!-- bob crossing the centre -->
  <circle cx="720" cy="532" r="13" fill="url(#bob)"/>
  <circle cx="720" cy="532" r="2.2" fill="#0d0b09" fill-opacity="0.55"/>

  <!-- grain -->
  <rect width="1440" height="1024" fill="none" filter="url(#grain)" opacity="0.55"/>
  <!-- vignette -->
  <rect width="1440" height="1024" fill="url(#pool)" opacity="0" />
</svg>
</div>
</body>
</html>
