name = "mathclass-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = false

# 路由:生产域名下的 /api/chat 绑到本 Worker(同域,前端同源调用)。
# 静态站其余路径仍由 Vultr 源站经 Cloudflare 代理提供;只有 /api/chat 走 Worker。
[[routes]]
pattern = "rucmathclass.com/api/chat"
zone_name = "rucmathclass.com"

# ⚠️ API key 绝不写进本文件。它是 secret:
#   wrangler secret put GEMINI_API_KEY
