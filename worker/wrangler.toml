name = "mathclass-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = false

# ElevenLabs 声音。⚠️ 免费层 API 只能用 premade(全英语)声音;法语「库声音」需
# EL 付费层(否则 402 paid_plan_required)。升级后把 TTS_VOICE 改成法语 Voice ID
# 即可(代码 env.TTS_VOICE 优先,缓存按声音区分);现回退到能用的 premade George。
[vars]
TTS_VOICE = "JBFqnCBsd6RMkjVDRZzb"

# 路由:生产域名下的 /api/chat 绑到本 Worker(同域,前端同源调用)。
# 静态站其余路径仍由 Vultr 源站经 Cloudflare 代理提供;只有 /api/chat 走 Worker。
[[routes]]
pattern = "rucmathclass.com/api/chat"
zone_name = "rucmathclass.com"

# 带通配符,否则 ?text=… 的请求不会匹配路由(会漏到源站)。
[[routes]]
pattern = "rucmathclass.com/api/speak*"
zone_name = "rucmathclass.com"

# 限流绑定:每 IP 每 60s 最多 30 次(防刷爆 Gemini/ElevenLabs 配额)。
# namespace_id 是自取的整数标识。代码里 env.RATE_LIMITER 缺失会自动跳过。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# ⚠️ API key 绝不写进本文件。它们是 secret:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put ELEVENLABS_API_KEY
